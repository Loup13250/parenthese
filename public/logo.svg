<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Ombre douce luxe -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2C2623" flood-opacity="0.12" />
    </filter>

    <!-- Dégradé Albâtre Chaud -->
    <linearGradient id="warmAlabaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F2ECE4" />
    </linearGradient>

    <!-- Dégradé Or Champagne Satiné -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF7C" />
      <stop offset="50%" stop-color="#B9925E" />
      <stop offset="100%" stop-color="#9C7A4D" />
    </linearGradient>
  </defs>

  <!-- Fond circulaire Albâtre Cocon -->
  <circle cx="250" cy="250" r="246" fill="url(#warmAlabaster)" filter="url(#softGlow)" />

  <!-- Double anneau liseré or -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#champagneGold)" stroke-width="2.5" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#champagneGold)" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Monogramme PH au centre -->
  <g text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif">
    <text x="250" y="210" font-size="115" font-weight="500" fill="#2C2623" letter-spacing="4">P H</text>
    <line x1="160" y1="235" x2="340" y2="235" stroke="url(#champagneGold)" stroke-width="1.5" />
    <text x="250" y="275" font-size="30" font-weight="600" fill="#2C2623" letter-spacing="8">LA PARENTHÈSE</text>
    <text x="250" y="315" font-size="28" font-style="italic" fill="url(#champagneGold)" letter-spacing="4">Harmonieuse</text>
    <text x="250" y="360" font-size="16" font-family="'DM Sans', sans-serif" font-weight="500" fill="#8C8078" letter-spacing="6">SALON-DE-PROVENCE</text>
  </g>
</svg>
